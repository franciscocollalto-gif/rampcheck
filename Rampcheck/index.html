<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f1f5f9;

  #frame { max-width: 480px; margin: 0 auto; background: #f8fafc; min-height: 100vh; padding-bottom: 40px; }

  /* Header */

  .langBtn { border: none; background: transparent; color: #64748b; font-weight: 700; font-size: 13px; padding: 5px 11px; border-radius: 7px; cursor: pointer; }
  .langBtn.on { background: #fff; color: #1e293b; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  h1.h1 { font-size: 27px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -0.5px; }

  .mvTrips { font-size: 10px; font-weight: 800; color: #92400e; background: #fef3c7; padding: 1px 7px; border-radius: 5px; margin-top: 3px; }
  .mvStand.sm { font-size: 14px; padding: 2px 8px; }

  .srcList { display: flex; flex-direction: column; gap: 7px; }
  .srcRow { display: flex; align-items: center; gap: 10px; }
  .srcQty { font-size: 16px; font-weight: 800; color: #166534; min-width: 20px; text-align: center; background: #dcfce7; border-radius: 7px; padding: 3px 9px; }
  .srcArrow { color: #94a3b8; font-weight: 800; }
  .srcFrom { font-size: 16px; font-weight: 700; color: #1e293b; }
  .srcTrips { margin-left: auto; font-size: 11px; font-weight: 800; color: #92400e; background: #fef3c7; padding: 2px 8px; border-radius: 6px; }
  .fillShort { margin-top: 8px; font-size: 12px; font-weight: 700; color: #D64545; }
  .tripsLine { margin-top: 9px; font-size: 12px; font-weight: 700; color: #64748b; }

  .zbGrid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  .zbNum { font-size: 26px; font-weight: 800; line-height: 1; }

  .zbTag.red { color: #D64545; } .zbTag.green { color: #1F9D57; } .zbTag.zero { color: #64748b; }

  .groups { padding: 18px 20px 0; }
  .group { margin-bottom: 22px; }

  .areaRow { display: flex; flex-wrap: wrap; gap: 10px; }

  /* Topbar */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 3px solid; background: #fff; position: sticky; top: 0; z-index: 5; }
  .back { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .topTitle { font-size: 22px; font-weight: 700; line-height: 1; }
  .topSub { font-size: 13px; color: #64748b; margin-top: 3px; }

  /* Stand grid */
  .standGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; }

  .neg { background: #D64545; }
  .pos { background: #1F9D57; }

  .matCard { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; margin: 10px 16px; padding: 13px 16px; }
  .matTop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .matName3 { font-size: 17px; font-weight: 800; }
  .scoreRow { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .scoreCol { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; }

  .scoreRow2 { display: flex; align-items: flex-start; justify-content: center; gap: 12px; }
  .scoreDiv { align-self: stretch; width: 1px; background: #e2e8f0; margin: 2px 0; }
  .miniStep { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .miniStepRow { display: flex; align-items: center; gap: 4px; }
  .hvBtn2 { width: 40px; height: 44px; border: none; border-radius: 10px; font-size: 24px; font-weight: 700; cursor: pointer; line-height: 1; }
  .hvBtn2.minus { background: #f1f5f9; color: #64748b; }
  .hvBtn2.plus { background: #1e293b; color: #fff; }
  .stepNum { width: 44px; font-size: 30px; font-weight: 800; text-align: center; border: none; background: transparent; outline: none; color: #1e293b; padding: 0; }

  .necFixWrap { height: 44px; display: flex; align-items: center; }

  .doneBtn { width: 100%; margin-top: 10px; background: #ecfdf3; color: #1F9D57; border: 1px solid #bbf7d0; border-radius: 10px; padding: 11px; font-weight: 800; font-size: 15px; cursor: pointer; }
  .doneBtn:active { background: #d1fae5; }
  .ndRow { display: flex; gap: 10px; }
  .ndBox { flex: 1; border-radius: 12px; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 7px; }

  .ndBox.nec { background: #eff6ff; border: 1px solid #dbeafe; }
  .ndLbl { font-size: 11px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
  .ndBox.hay .ndLbl { color: #64748b; }
  .ndBox.nec .ndLbl { color: #2563eb; }
  .haveInp { width: 58px; font-size: 34px; font-weight: 800; text-align: center; border: none; background: transparent; outline: none; color: #1e293b; padding: 0; line-height: 1; }

  .slash { font-size: 22px; color: #cbd5e1; font-weight: 700; }

  .needInp2:focus { border-color: #2563eb; }
  .needInp2::placeholder { color: #cbd5e1; }
  .needFix2 { font-size: 22px; font-weight: 800; color: #2563eb; }
  .scoreCap { font-size: 10px; color: #94a3b8; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
  .hvBtn { width: 46px; height: 46px; border: none; border-radius: 12px; font-size: 26px; font-weight: 700; cursor: pointer; line-height: 1; }
  .hvBtn.minus { background: #f1f5f9; color: #64748b; }
  .hvBtn.plus { background: #1e293b; color: #fff; }

  .rSob { font-size: 14px; font-weight: 800; color: #fff; background: #1F9D57; padding: 5px 12px; border-radius: 8px; white-space: nowrap; }
  .rOk { font-size: 19px; font-weight: 900; color: #1F9D57; }

  .weightRow { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 14px; }

  .unit { font-size: 18px; color: #64748b; font-weight: 600; }

  .stepHead { display: flex; justify-content: space-between; align-items: center; }

};
function faltanTxt(n){ return state.lang==="es" ? "Faltan "+n : n+" fehlen"; }
function faltanWagenTxt(n){ return state.lang==="es" ? "Faltan "+n+" Wagen" : "Es fehlen "+n+" Wagen"; }
function sobranWagenTxt(n){ return state.lang==="es" ? "Sobran "+n+" Wagen — se pueden sacar" : n+" Wagen übrig — können abgezogen werden"; }
function perLoadTxt(n, crew){
  if (crew>0) return state.lang==="es" ? n+" por carga + "+crew+" crew" : n+" pro Ladung + "+crew+" Crew";
  return state.lang==="es" ? n+" por carga" : n+" pro Ladung";
}
function fromToTxt(from,to){ return state.lang==="es" ? "de "+from+" a "+to : "von "+from+" nach "+to; }

/* ============================================================
   Estado + persistencia
   ============================================================ */
let state = { data:{}, lang:"es", view:{name:"home"}, mapCat:"todo", day:"" };

function load(){
  try { const d = localStorage.getItem(LS_DATA); if (d) state.data = JSON.parse(d); } catch(e){}
  try { const l = localStorage.getItem(LS_LANG); if (l) state.lang = l; } catch(e){}
  try { const dy = localStorage.getItem(LS_DAY); if (dy) state.day = dy; } catch(e){}
  if (!state.day){ state.day = todayStr(); saveDay(); }
}
function save(){
  try { localStorage.setItem(LS_DATA, JSON.stringify(state.data)); } catch(e){}
}
function saveLang(){ try { localStorage.setItem(LS_LANG, state.lang); } catch(e){} }
function saveDay(){ try { localStorage.setItem(LS_DAY, state.day); } catch(e){} }

function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+dd;
}
function fmtDay(s){ if(!s) return ""; const p = s.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }

function clearNewDay(){
  const t = T[state.lang];
  if (!window.confirm(t.clearConfirm)) return;
  state.data = {};
  state.day = todayStr();
  save(); saveDay();
  state.view = {name:"home"};
  render();
}

function emptyStand(){
  return { weight:"", wagen:{have:0,need:0}, dolly:{need:0,have:0}, trailer:{need:0,have:0}, wageli:{need:0,have:0}, post:{need:0,have:0,kg:""} };
}
function getStand(id){
  if (!state.data[id]) state.data[id] = emptyStand();
  const s = state.data[id];
  if (typeof s.wagen !== "object") s.wagen = { have: Number(s.wagen)||0, need:0 };
  if (s.wagen.need == null) s.wagen.need = 0;
  MAT_KEYS.forEach(m => { if (m==="wagen") return; if (typeof s[m] !== "object") s[m] = { need:0, have:Number(s[m])||0 }; });
  if (s.post.kg == null) s.post.kg = "";
  if (s.retirar == null) s.retirar = 0;
  if (s.aviso == null) s.aviso = 0;
  return s;
}
// Accesos por material
function matNeed(id, s, mat){
  if (mat==="wagen"){
    const ov = Number((s.wagen && s.wagen.need)||0);
    if (ov>0) return ov;               // si se dictó a mano, gana
    return wagenNeeded(s.weight, id);  // si no, lo calcula el peso (÷200 + crew)
  }
  if (mat==="post"){
    const ov = Number((s.post && s.post.need)||0);
    if (ov>0) return ov;               // si se dictó a mano, gana
    const w = Number(s.post && s.post.kg)||0;
    return w>0 ? Math.ceil(w/150) : 0; // 1 postwagen cada 150 kg (kilos propios)
  }
  return Number((s[mat]&&s[mat].need)||0);
}
function matHave(s, mat){ return Number((s[mat]&&s[mat].have)||0); }

/* ============================================================
   Lógica
   ============================================================ */
function crewFor(id){
  const a = AREA_OF_STAND[id];
  return (a && (a.id==="ECHO_N" || a.id==="ECHO_S")) ? 2 : 0;
}
function wagenNeeded(weight, id){ const w = Number(weight)||0; if (w<=0) return 0; return Math.ceil(w/KG) + crewFor(id); }
function isTouched(s){
  if ((Number(s.weight)||0)>0) return true;
  return MAT_KEYS.some(m => { const o = s[m]; if (!o) return false; return (Number(o.need)||0)>0 || (Number(o.have)||0)>0; });
}
function standItems(s, id){
  const items = [];
  MAT_KEYS.forEach(m => {
    const need = matNeed(id, s, m), have = matHave(s, m);
    if (need===0 && have===0) return;
    const d = have - need;
    if (d!==0) items.push({k:m, v:d});
  });
  items.sort((a,b) => a.v - b.v);
  return items;
}
function cellInfo(cat, s, id){
  const need = matNeed(id, s, cat), have = matHave(s, cat);
  if (need===0 && have===0) return {state:"empty", val:0};
  const d = have - need;
  return {state: d<0?"miss":d>0?"have":"zero", val:d};
}
function areaStatus(area){
  const per = {}; MAT_KEYS.forEach(m => per[m] = {need:0, have:0});
  let touched=0, deficit=0;
  area.stands.forEach(id => {
    const s = state.data[id] || emptyStand();
    MAT_KEYS.forEach(m => { per[m].need += matNeed(id,s,m); per[m].have += matHave(s,m); });
    const wn = matNeed(id,s,"wagen"), wh = matHave(s,"wagen");
    if (wn>0 && wh<wn) deficit += wn-wh;
    if (isTouched(s)) touched++;
  });
  return {per, touched, deficit};
}

/* ============================================================
   Utilidades de render
   ============================================================ */
function esc(x){ return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function signed(v){ return v>0 ? "+"+v : ""+v; }

/* ============================================================
   Pantallas
   ============================================================ */
function screenHome(){
  const t = T[state.lang];
  const groups = [];
  AREAS.forEach(a => {
    const last = groups[groups.length-1];
    if (last && last.parent===a.parent) last.areas.push(a);
    else groups.push({parent:a.parent, color:a.color, areas:[a]});
  });
  let html = '<div class="header"><div class="headTop"><div class="kicker">'+t.kicker+'</div>'+
    '<div class="langToggle">'+
      '<button class="langBtn '+(state.lang==="es"?"on":"")+'" data-action="lang" data-lang="es">ES</button>'+
      '<button class="langBtn '+(state.lang==="de"?"on":"")+'" data-action="lang" data-lang="de">DE</button>'+
    '</div></div></div>';
  const isOld = state.day && state.day !== todayStr();
  html += '<div class="dayBar"><span class="dayText">'+t.dayLabel+': <b>'+fmtDay(state.day)+'</b></span>'+
    '<button class="dayBtn" data-action="newday">'+t.newDay+'</button></div>';
  if (isOld) html += '<div class="banner"><span>'+t.oldDayMsg+' ('+fmtDay(state.day)+')</span>'+
    '<button class="bannerBtn" data-action="newday">'+t.startNewDay+'</button></div>';
  html += '<div class="actions">'+
    '<button class="bigBtn photoBtn" data-action="photo"><span>'+t.photoBtn+'</span><span>→</span></button>'+
    '<button class="bigBtn planBtn" data-action="plan"><span>'+t.planBtn+'</span><span>→</span></button>'+
    '<button class="bigBtn mapBtn" data-action="map"><span>'+t.mapBtn+'</span><span>→</span></button>'+
    '<button class="bigBtn balBtn" data-action="balance"><span>'+t.balanceBtn+'</span><span>→</span></button></div>';
  html += '<div class="groups">';
  groups.forEach(g => {
    html += '<div class="group"><div class="groupHead"><span class="dot" style="background:'+g.color+'"></span><span>'+g.parent+'</span></div><div class="areaRow">';
    g.areas.forEach(a => {
      const st = areaStatus(a);
      let chip = "";
      if (st.deficit>0) chip = '<span class="chipFalta">'+faltanTxt(st.deficit)+'</span>';
      else if (st.touched>0) chip = '<span class="chipOk">'+t.ok+'</span>';
      html += '<button class="areaCard" data-action="open-area" data-area="'+a.id+'">'+
        '<span class="areaLabel">'+a.label+'</span>'+
        '<span class="areaMeta">'+a.stands.length+' '+t.stands+'</span>'+chip+'</button>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

function topbar(title, sub, color, backTo, backArea){
  return '<div class="topbar" style="border-color:'+color+'">'+
    '<button class="back" data-action="back" data-to="'+backTo+'" '+(backArea?('data-area="'+backArea+'"'):'')+'>←</button>'+
    '<div><div class="topTitle">'+title+'</div>'+(sub?('<div class="topSub">'+sub+'</div>'):'')+'</div></div>';
}

function screenArea(){
  const t = T[state.lang];
  const area = AREA_BY_ID[state.view.areaId];
  let html = topbar(area.label, "", area.color, "home");
  html += '<div class="standGrid">';
  area.stands.forEach(id => {
    const s = state.data[id] || emptyStand();
    const items = standItems(s, id);
    const touched = isTouched(s);
    let chips = "";
    if (items.length){
      chips = '<span class="cellChips">';
      items.forEach(it => {
        chips += '<span class="cellChip '+(it.v<0?"neg":"pos")+'">'+signed(it.v)+' '+t.labels[it.k]+'</span>';
      });
      chips += '</span>';
    } else if (touched){
      chips = '<span class="cellDone">✓</span>';
    }
    html += '<button class="standCell '+(touched?"on":"")+'" data-action="open-stand" data-stand="'+id+'">'+
      '<span class="standName tnum">'+id+'</span>'+chips+'</button>';
  });
  html += '</div>';

  // Balance de la zona + cómo nivelar (solo si hay datos cargados)
  const touchedCount = area.stands.filter(id => isTouched(state.data[id]||emptyStand())).length;
  if (touchedCount>0){
    const bal = zoneBalance(area);
    const mats = MAT_KEYS.filter(m => bal[m].falta>0 || bal[m].sobra>0);
    if (mats.length){
      html += '<div class="block"><div class="blockTitle">'+t.zoneBalance+'</div><div class="zbGrid">';
      mats.forEach(m => {
        const net = bal[m].net;
        const cls = net<0?"red":net>0?"green":"zero";
        const tag = net<0?t.faltaWord:net>0?t.sobraWord:t.okWord;
        const numTxt = net<0?("−"+Math.abs(net)):net>0?("+"+net):"0";
        html += '<div class="zbTile"><div class="zbNum '+cls+' tnum">'+numTxt+'</div><div class="zbLbl">'+t.labels[m]+'</div><div class="zbTag '+cls+'">'+tag+'</div></div>';
      });
      html += '</div></div>';
    }
    let movesBody = "";
    MAT_KEYS.forEach(m => {
      const rr = routesForMaterial(m, area.stands);
      if (!rr.routes.length) return;
      movesBody += '<div class="planSub">'+t.labels[m]+'</div>'+routesHTML(rr, m);
    });
    if (movesBody) html += '<div class="block"><div class="blockTitle">'+t.zoneLevel+'</div>'+movesBody+'</div>';
  }

  return html;
}

function resInner(need, have, t){
  if (need===0 && have===0) return '<span class="rNone">–</span>';
  const d = have - need;
  if (d<0) return '<span class="rMiss">'+t.faltaWord+' '+Math.abs(d)+'</span>';

/* ============================================================
   Plan de traslados (inteligente)
   ============================================================ */
function zoneBalance(area){
  const res = {};
  MAT_KEYS.forEach(mat => {
    let net = 0, falta = 0, sobra = 0;
    area.stands.forEach(id => {
      const s = state.data[id] || emptyStand();
      const need = matNeed(id, s, mat), have = matHave(s, mat);
      if (need===0 && have===0) return;
      const q = have - need;
      net += q;
      if (q<0) falta += -q; else if (q>0) sobra += q;
    });
    res[mat] = {net, falta, sobra};
  });
  return res;
}

function planForMaterial(mat, standIds){
  const ids = standIds || ALL_STANDS;
  const sup = [], def = [];
  ids.forEach(id => {
    const a = AREA_OF_STAND[id];
    const s = state.data[id] || emptyStand();
    const need = matNeed(id, s, mat), have = matHave(s, mat);
    if (need===0 && have===0) return;
    const q = have - need;
    if (q>0) sup.push({id, zone:a.parent, qty:q});
    else if (q<0) def.push({id, zone:a.parent, qty:-q});
  });

  // copia para mostrar "hay de más" y "falta" (antes de repartir)
  const rawSup = sup.map(x => ({id:x.id, qty:x.qty})).sort((a,b) => b.qty-a.qty);
  const rawDef = def.map(x => ({id:x.id, qty:x.qty})).sort((a,b) => b.qty-a.qty);

  // emparejar lo más grande primero = menos movimientos
  sup.sort((a,b) => b.qty-a.qty);
  def.sort((a,b) => b.qty-a.qty);

  const moves = [];
  function match(sameZoneOnly){
    def.forEach(d => {
      if (d.qty<=0) return;
      sup.forEach(sp => {
        if (d.qty<=0 || sp.qty<=0) return;
        if (sameZoneOnly && sp.zone!==d.zone) return;
        const take = Math.min(sp.qty, d.qty);
        moves.push({from:sp.id, to:d.id, qty:take, sameZone:sp.zone===d.zone});
        sp.qty -= take; d.qty -= take;
      });
    });
  }
  match(true);
  match(false);

  // agrupar por plaza de destino (cómo completar cada una)
  const byDest = {};
  moves.forEach(mv => {
    if (!byDest[mv.to]) byDest[mv.to] = {to:mv.to, sources:[], short:0};
    byDest[mv.to].sources.push({from:mv.from, qty:mv.qty});
  });
  def.forEach(d => { if (d.qty>0 && byDest[d.id]) byDest[d.id].short += d.qty; });

  const remainingDef = def.reduce((x,d) => x + Math.max(0,d.qty), 0);
  const remainingSup = sup.reduce((x,s) => x + Math.max(0,s.qty), 0);
  return {moves, byDest, remainingDef, remainingSup, rawSup, rawDef};
}

function bringTxt(sources){
  const verb = state.lang==="es" ? "Traé " : "Hol ";
  const sep = state.lang==="es" ? " de " : " von ";
  return verb + sources.map(s => s.qty + sep + s.from).join("   ·   ");
}
function outsideTxt(n){ return state.lang==="es" ? "Faltan "+n+" de afuera" : n+" von aussen holen"; }
function tripsLineTxt(trips, cap){
  const v = state.lang==="es" ? (trips===1?"1 viaje":trips+" viajes") : (trips===1?"1 Fahrt":trips+" Fahrten");
  if (cap>=99) return v;
  return v + (state.lang==="es" ? " · hasta "+cap+" por viaje" : " · bis "+cap+" pro Fahrt");
}
function viajesTxt(n){
  if (state.lang==="es") return n + (n===1 ? " viaje" : " viajes");
  return n + (n===1 ? " Fahrt" : " Fahrten");
}
function routesForMaterial(mat, standIds){
  const p = planForMaterial(mat, standIds);
  const cap = CAPS[mat] || 99;
  const groups = {};
  p.moves.forEach(mv => {
    const zone = AREA_OF_STAND[mv.to].parent;
    const key = mv.from + "|" + zone;
    if (!groups[key]) groups[key] = { from: mv.from, zone, stops: [] };
    groups[key].stops.push({ to: mv.to, qty: mv.qty });
  });
  const routes = Object.keys(groups).map(k => {
    const g = groups[k];
    g.stops.sort((a,b) => a.to < b.to ? -1 : 1);
    const total = g.stops.reduce((x,s) => x+s.qty, 0);
    return { from:g.from, zone:g.zone, stops:g.stops, total, trips: Math.ceil(total/cap) };
  });
  return { routes, remainingDef: p.remainingDef, remainingSup: p.remainingSup };
}

function mountPhotoUI(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
  inp.id = "photoInput"; inp.style.display = "none";
  inp.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => handlePhoto(reader.result);
    reader.readAsDataURL(file);
    inp.value = "";
  });
  document.body.appendChild(inp);
}

async function handlePhoto(dataUrl){
  const t = T[state.lang];
  toast("Leyendo la pantalla…");
  try {
    const resp = await fetch(PHOTO_URL, { method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ image: dataUrl, stands: ALL_STANDS }) });
    if (!resp.ok) throw new Error("http "+resp.status);
    const j = await resp.json();
    if (!j || j.error || !Array.isArray(j.flights)) throw new Error("noai");
    state.photo = j.flights;
    state.view = { name:"photo" };
    render();
  } catch(e){
    toast(t.photoNotReady);
  }
}

      if (Number(f.dolly)>0) s.dolly.need = Number(f.dolly);
      if (Number(f.trailer)>0) s.trailer.need = Number(f.trailer);
      s.retirar = Number(f.empties)>0 ? Number(f.empties) : 0;

  save();

    html += '<div class="block"><div class="pvHead"><span class="pvStand tnum">'+f.stand+'</span>'+
      '<span class="pvFlight">'+(f.flight||"")+(f.type?(" · "+f.type):"")+'</span></div>'+
      '<div class="pvChips">'+(chips||'<span class="pvNone">—</span>')+'</div>'+ret+'</div>';
  });

  dep.forEach(f => {
    html += '<div class="block pvDep"><span class="pvStand tnum">'+f.stand+'</span> '+
      '<span class="pvDepTxt">↗ '+(f.flight||"")+(f.type?(" ("+f.type+")"):"")+' · '+t.photoSalida+'</span></div>';
  });

  html += '<div class="actions" style="padding:6px 16px 20px">'+
    '<button class="bigBtn balBtn" data-action="photo-load"><span>'+t.photoLoad+'</span><span>→</span></button>'+
    '<button class="bigBtn mapBtn" data-action="back" data-to="home"><span>'+t.photoCancel+'</span></button></div>';
  return html;
}
function render(){
  const frame = document.getElementById("frame");
  let html = "";
  switch(state.view.name){
    case "home": html = screenHome(); break;
    case "area": html = screenArea(); break;
    case "stand": html = screenStand(); break;
    case "balance": html = screenBalance(); break;
    case "map": html = screenMap(); break;
    case "plan": html = screenPlan(); break;
    case "photo": html = screenPhoto(); break;
  }
  frame.innerHTML = html;
  frame.scrollIntoView({block:"start"});
  window.scrollTo(0,0);
}

/* ============================================================
   Eventos
   ============================================================ */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action==="lang"){ state.lang = el.dataset.lang; saveLang(); render(); return; }
  if (action==="newday"){ clearNewDay(); return; }
  if (action==="map"){ state.view = {name:"map"}; render(); return; }
  if (action==="plan"){ state.view = {name:"plan"}; render(); return; }
  if (action==="photo"){ const el2 = document.getElementById("photoInput"); if (el2) el2.click(); return; }
  if (action==="photo-load"){ applyPhotoFlights(state.photo||[]); state.photo=null; state.view={name:"home"}; render(); toast("✓ Cargado"); return; }
  if (action==="balance"){ state.view = {name:"balance"}; render(); return; }
  if (action==="open-area"){ state.view = {name:"area", areaId: el.dataset.area}; render(); return; }
  if (action==="open-stand"){ state.view = {name:"stand", standId: el.dataset.stand}; render(); return; }
  if (action==="mapcat"){ state.mapCat = el.dataset.cat; render(); return; }
  if (action==="back"){
    const to = el.dataset.to;
    if (to==="area") state.view = {name:"area", areaId: el.dataset.area};
    else state.view = {name:"home"};
    render(); return;
  }
  if (action==="complete-stand"){
    const id = state.view.standId;
    const s = getStand(id);
    MAT_KEYS.forEach(m => {
      const need = matNeed(id, s, m);
      if (!s[m]) s[m] = (m==="wagen" ? {have:0,need:0} : {need:0,have:0});
      s[m].have = need;
    });
    save(); render(); toast("✓ "+id+" completo");
    return;
  }
  if (action==="adj"){
    const id = state.view.standId;
    const mat = el.dataset.mat;
    const fld = el.dataset.fld || "have";
    const delta = parseInt(el.dataset.delta,10);
    const s = getStand(id);
    if (!s[mat]) s[mat] = (mat==="wagen" ? {have:0,need:0} : {need:0, have:0});
    let v = (Number(s[mat][fld])||0) + delta;
    if (v<0) v = 0;
    s[mat][fld] = v; save();
    const inp = document.getElementById(fld+"-"+mat);
    if (inp && inp.tagName==="INPUT") inp.value = (v>0 ? v : "");
    const t = T[state.lang];
    refreshMat(id, s, mat, t);
    refreshStandStatus(id, s, t);
    return;
  }
  if (action==="done-mat"){
    const id = state.view.standId;
    const mat = el.dataset.mat;
    const s = getStand(id);
    const need = matNeed(id, s, mat);
    if (!s[mat]) s[mat] = (mat==="wagen" ? {have:0,need:0} : {need:0, have:0});
    s[mat].have = need; save();
    const inp = document.getElementById("have-"+mat);
    if (inp && inp.tagName==="INPUT") inp.value = (need>0 ? need : "");
    const t = T[state.lang];
    refreshMat(id, s, mat, t);
    refreshStandStatus(id, s, t);
    return;
  }
});

    refreshMat(id, s, mat, t);
    refreshStandStatus(id, s, t);
    return;

/* ============================================================
   Carga por voz (español)
   ============================================================ */
const PHON = { echo:"e", eco:"e", alpha:"a", alfa:"a", bravo:"b", charlie:"c", charli:"c", delta:"d", foxtrot:"f", fox:"f", golf:"g", hotel:"h", india:"i", papa:"p", tango:"t", whiskey:"w", whisky:"w" };
const NUM = { cero:0, un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10, once:11, doce:12, trece:13, catorce:14, quince:15, dieciseis:16, "dieciséis":16, diecisiete:17, dieciocho:18, diecinueve:19, veinte:20, veintiuno:21, veintidos:22, "veintidós":22, veintitres:23, "veintitrés":23, veinticuatro:24, veinticinco:25, veintiseis:26, veintisiete:27, veintiocho:28, veintinueve:29, treinta:30, cuarenta:40, cincuenta:50, sesenta:60, setenta:70, ochenta:80, noventa:90 };
const VOICE_MAT = {
  wagen: ["wagen","wagenes","wageli","wagelis","wagueli","waguelis","bagueli","gagueli","carro","carros"],
  dolly: ["dolly","dollys","dollis","doli","dolis","dollies","doly"],
  trailer: ["trailer","trailers","traailer","treiler","treilers","traila","trailel"],
  wageli: ["degerwage","deguerwage","deger","deguer","degerwagen","degel","cerrado","cerrados"],
  post: ["postwagen","postwagenes","post","posts","poste","postes"]
};
const MAT_LOOKUP = {}; Object.keys(VOICE_MAT).forEach(k => VOICE_MAT[k].forEach(syn => MAT_LOOKUP[syn] = k));
const SMART_URL = "/api/parse";
const PHOTO_URL = "/api/photo";
const SMART_ON = (location.protocol==="http:" || location.protocol==="https:");
function matchMaterial(w){
  if (MAT_LOOKUP[w]) return MAT_LOOKUP[w];
  const s = w.replace(/s$/,"");
  if (MAT_LOOKUP[s]) return MAT_LOOKUP[s];
  if (w.length < 4) return null;
  for (const k in VOICE_MAT){
    for (const syn of VOICE_MAT[k]){
      if (syn.length>=4 && (w.slice(0,4)===syn.slice(0,4))) return k;
    }
  }
  return null;
}

function wordsToNumbers(tokens){
  const out = [];
  for (let i=0;i<tokens.length;i++){
    const w = tokens[i];
    if (w in NUM){
      let val = NUM[w];
      if (val>=30 && val%10===0 && tokens[i+1]==="y" && (tokens[i+2] in NUM) && NUM[tokens[i+2]]<10){ val += NUM[tokens[i+2]]; i+=2; }
      out.push(String(val));
    } else out.push(w);
  }
  return out;
}

function parseVoice(transcript){
  let txt = transcript.toLowerCase();
  txt = txt.replace(/[.,;:!¡¿?]/g," ");
  txt = txt.replace(/([a-z])(\d)/g,"$1 $2").replace(/(\d)([a-z])/g,"$1 $2");
  let tokens = txt.split(/\s+/).filter(Boolean).map(w => PHON[w] || w);
  tokens = wordsToNumbers(tokens);

  const consumed = {};
  let stand = null;
  for (let i=0;i<tokens.length-1;i++){
    if (/^[a-z]$/.test(tokens[i]) && /^\d+$/.test(tokens[i+1])){
      const cand = (tokens[i] + tokens[i+1]).toUpperCase();
      if (AREA_OF_STAND[cand]){ stand = cand; consumed[i]=true; consumed[i+1]=true; break; }
    }
  }

  const have = {}, need = {}, adjust = {}; let weight = null, postKg = null;
  let pendingNum = null, op = null, weightNext = false, mode = "have";
  for (let i=0;i<tokens.length;i++){
    if (consumed[i]) continue;
    const w = tokens[i];
    if (/^\d+$/.test(w)){ if (weightNext){ weight = parseInt(w,10); weightNext=false; } else pendingNum = parseInt(w,10); continue; }
    if (w==="tengo"||w==="hay"||w==="tiene"||w==="tienen"||w==="tenemos"){ mode="have"; continue; }
    if (w==="necesito"||w==="necesita"||w==="necesitan"||w==="necesitamos"||w==="pide"||w==="pone"){ mode="need"; continue; }
    if (w==="peso"||w==="pesa"){ weightNext = true; continue; }
    if (w==="kilos"||w==="kilo"||w==="kg"||w==="kilogramos"||w==="kilogramo"){ if (pendingNum!=null){ weight = pendingNum; pendingNum = null; } continue; }
    if (w==="mas"||w==="más"||w==="sumar"||w==="suma"||w==="agrega"||w==="agregar"){ op="mas"; continue; }
    if (w==="menos"||w==="restar"||w==="resta"||w==="saca"||w==="sacar"||w==="quita"||w==="quitar"){ op="menos"; continue; }
    const mk = matchMaterial(w);
    if (mk){
      // Postwagen con kilos propios: "postwagen 300 kilos"
      if (mk==="post" && /^\d+$/.test(tokens[i+1]||"") && /^(kilos|kilo|kg|kilogramos|kilogramo)$/.test(tokens[i+2]||"")){
        postKg = parseInt(tokens[i+1],10); consumed[i+1]=true; consumed[i+2]=true; pendingNum=null; op=null; continue;
      }
      let q = pendingNum;
      if (q==null && /^\d+$/.test(tokens[i+1]||"")){ q = parseInt(tokens[i+1],10); consumed[i+1]=true; }
      if (op){ adjust[mk] = (adjust[mk]||0) + (op==="menos" ? -(q==null?1:q) : (q==null?1:q)); }
      else if (q!=null){ if (mode==="need") need[mk] = q; else have[mk] = q; }
      pendingNum = null; op = null; continue;
    }
    pendingNum = null; op = null;
  }
  return { stand, weight, postKg, have, need, adjust };
}

function toast(msg){
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 3800);
}

function applyParsed(r, heard){
  heard = (heard||"").trim();
  const okKey = m => MAT_KEYS.indexOf(m)>=0;
  const gotSomething = r.stand || r.weight!=null || r.postKg!=null || (r.have&&Object.keys(r.have).length) || (r.need&&Object.keys(r.need).length) || (r.adjust&&Object.keys(r.adjust).length);
  const id = r.stand || (state.view.name==="stand" ? state.view.standId : null);
  if (!id){ toast('Escuché: "'+heard+'" · No pillé el platz. Ej: "E19 350 kilos 4 dolly"'); return; }
  if (!gotSomething){ toast('Escuché: "'+heard+'" · No entendí cantidades'); return; }
  const s = getStand(id);
  if (r.weight!=null && !isNaN(r.weight)) s.weight = String(r.weight);
  if (r.postKg!=null && !isNaN(r.postKg)) s.post.kg = String(r.postKg);
  Object.keys(r.have||{}).forEach(m => { if(!okKey(m)) return; if (!s[m]) s[m]=(m==="wagen"?{have:0,need:0}:{need:0,have:0}); s[m].have = Number(r.have[m])||0; });
  Object.keys(r.need||{}).forEach(m => { if(!okKey(m)) return; if (!s[m]) s[m]=(m==="wagen"?{have:0,need:0}:{need:0,have:0}); s[m].need = Number(r.need[m])||0; });
  Object.keys(r.adjust||{}).forEach(m => { if(!okKey(m)) return; if (!s[m]) s[m]=(m==="wagen"?{have:0,need:0}:{need:0,have:0}); s[m].have = Math.max(0,(Number(s[m].have)||0)+(Number(r.adjust[m])||0)); });
  save();
  state.view = { name:"stand", standId:id };
  render();
  const t = T[state.lang]; const parts = [];
  if (r.weight!=null) parts.push(r.weight+"kg");
  if (r.postKg!=null) parts.push("post "+r.postKg+"kg");
  Object.keys(r.have||{}).forEach(m => { if(okKey(m)) parts.push(t.labels[m]+" "+r.have[m]); });
  Object.keys(r.need||{}).forEach(m => { if(okKey(m)) parts.push(t.labels[m]+" nec "+r.need[m]); });
  Object.keys(r.adjust||{}).forEach(m => { if(okKey(m)) parts.push(t.labels[m]+" "+(r.adjust[m]>0?"+":"")+r.adjust[m]); });
  toast("✓ "+id + (parts.length ? " · "+parts.join(" · ") : ""));
}

async function smartParse(transcript){
  const resp = await fetch(SMART_URL, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ transcript, stands: ALL_STANDS }) });
  if (!resp.ok) throw new Error("http "+resp.status);
  const j = await resp.json();
  if (!j || j.error) throw new Error("noai");
  return { stand: j.stand||null, weight:(j.weight==null?null:Number(j.weight)), postKg:(j.postKg==null?null:Number(j.postKg)), have:j.have||{}, need:j.need||{}, adjust:j.adjust||{} };
}

async function handleVoice(transcript){
  if (SMART_ON){
    toast("Pensando…");
    try { const r = await smartParse(transcript); applyParsed(r, transcript); return; }
    catch(_){ /* si la IA no está o falla, uso el parser local */ }
  }
  applyParsed(parseVoice(transcript), transcript);
}

function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast("Este navegador no permite voz. En iPhone usá Safari (no Chrome), abriendo el link (no el ícono de inicio)."); return; }
  if (window.navigator.standalone === true){ toast("Estás en la app instalada (ícono). El micrófono solo anda abriendo el link en Safari."); return; }
  toast("Activando micrófono…");
  const btn = document.getElementById("micBtn");
  let rec;
  try { rec = new SR(); } catch(_){ toast("No pude iniciar el micrófono"); return; }
  rec.lang = "es-AR"; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 1;
  let finalTxt = "", started = false;
  rec.onstart = () => { started = true; if (btn) btn.classList.add("listening"); toast("Escuchando… hablá ya, cerca del teléfono"); };
  rec.onresult = (e) => { let t=""; for (let i=0;i<e.results.length;i++) t += e.results[i][0].transcript + " "; finalTxt = t.trim(); };
  rec.onerror = (e) => {
    if (btn) btn.classList.remove("listening");
    if (e.error==="no-speech") toast("No te escuché. Activá Ajustes → General → Teclado → Dictado. Y hablá apenas tocás.");
    else if (e.error==="not-allowed" || e.error==="service-not-allowed") toast("Micrófono bloqueado. Usá Safari (no el ícono) y Ajustes → Safari → Micrófono → Permitir.");
    else if (e.error==="audio-capture") toast("No encuentro micrófono en este equipo.");
    else if (e.error!=="aborted") toast("Micrófono: "+e.error);
  };
  rec.onend = () => { if (btn) btn.classList.remove("listening"); if (finalTxt) handleVoice(finalTxt); };
  try { rec.start(); } catch(err){ toast("No arrancó el micrófono: "+((err&&err.name)||"error")); return; }
  setTimeout(() => { if (!started) toast("El micrófono no respondió. En iPhone: abrí en Safari (no el ícono) y activá el Dictado (Ajustes→General→Teclado)."); }, 1600);
}

function mountVoiceUI(){
  // Micrófono desactivado por ahora (el de Safari en iPhone no es confiable)
  const tst = document.createElement("div"); tst.id = "toast";
  document.body.appendChild(tst);
}

function goBack(){
  const v = state.view;
  if (v.name==="stand"){ state.view = { name:"area", areaId: AREA_OF_STAND[v.standId].id }; render(); }
  else if (v.name==="area" || v.name==="balance" || v.name==="map" || v.name==="plan"){ state.view = { name:"home" }; render(); }
}
function setupSwipeBack(){
  let sx=0, sy=0, st=0, ok=false;
  document.addEventListener("touchstart", e => {
    if (!e.touches || e.touches.length!==1){ ok=false; return; }
    const tt = e.touches[0]; sx=tt.clientX; sy=tt.clientY; st=Date.now();
    ok = !(e.target.closest && e.target.closest(".mapPicker, input, textarea, select"));
  }, {passive:true});
  document.addEventListener("touchend", e => {
    if (!ok) return; ok=false;
    const tt = e.changedTouches[0];
    const dx = tt.clientX - sx, dy = tt.clientY - sy, dt = Date.now() - st;
    if (dx>80 && Math.abs(dy)<50 && Math.abs(dx) > Math.abs(dy)*2 && dt<700) goBack();
  }, {passive:true});
}

/* Arranque */
load();
mountVoiceUI();
mountPhotoUI();
setupSwipeBack();
render();
